<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Znak Průniku: dva kruhy (solidarita a svoboda) a jejich průnik.
       Slouží jako logo v liště i jako ikona v záložce prohlížeče. -->
  <defs>
    <clipPath id="levy"><circle cx="25" cy="32" r="15"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0d1020"/>
  <circle cx="25" cy="32" r="15" fill="none" stroke="#ff6b57" stroke-width="4"/>
  <circle cx="39" cy="32" r="15" fill="none" stroke="#4c8dff" stroke-width="4"/>
  <circle cx="39" cy="32" r="15" fill="#d4ff3f" clip-path="url(#levy)"/>
</svg>
